name: Continuous integration

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test SteamKitSDK.Tests/SteamKitSDK.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - name: Pack
        run: dotnet pack SteamKitSDK.sln --configuration Release --no-build --no-restore --output artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  windows-authentication:
    name: Windows authentication tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build Windows package
        run: dotnet build SteamKitSDK.Windows.Tests/SteamKitSDK.Windows.Tests.csproj --configuration Release --no-restore
      - name: Test Windows package
        run: dotnet test SteamKitSDK.Windows.Tests/SteamKitSDK.Windows.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-authentication-results.trx" --collect:"XPlat Code Coverage"
      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
      - name: Upload Windows code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-code-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
